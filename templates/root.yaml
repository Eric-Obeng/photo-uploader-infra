AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Root stack for the Photo Uploader infrastructure. Declares the network,
  security-groups, storage, CDN, database, ECR, ALB, ECS, CodeDeploy,
  pipeline, and EventBridge nested stacks, and wires their parameters and
  outputs together.

Parameters:
  EnvironmentName:
    Type: String
    Default: photo-uploader

  TemplateBucketName:
    Type: String
    Description: S3 bucket holding the uploaded nested child templates (deployment artifacts bucket)

  TemplateVersion:
    Type: String
    Description: Key prefix/version under which the current set of child templates was uploaded (e.g. a commit SHA)

  AccessLogsBucketName:
    Type: String
    Description: Name of the shared S3 access-logs bucket, output by the standalone bootstrap stack

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24

  ContainerPort:
    Type: Number
    Default: 3000

  DatabasePort:
    Type: Number
    Default: 5432

  DatabaseInstanceClass:
    Type: String
    Default: db.t3.micro

  DatabaseName:
    Type: String
    Default: photouploader

  HealthCheckPath:
    Type: String
    Default: /health

  ImageTag:
    Type: String
    Default: latest

  TaskCpu:
    Type: String
    Default: '256'

  TaskMemory:
    Type: String
    Default: '512'

  CpuScalingTargetValue:
    Type: Number
    Default: 60

  ServiceDesiredCount:
    Type: Number
    Default: 1

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/network.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/security-groups.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        ContainerPort: !Ref ContainerPort
        DatabasePort: !Ref DatabasePort
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  StorageStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/storage.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        AccessLogsBucketName: !Ref AccessLogsBucketName
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  CdnStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/cdn.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ImagesBucketName: !GetAtt StorageStack.Outputs.ImagesBucketName
        ImagesBucketArn: !GetAtt StorageStack.Outputs.ImagesBucketArn
        ImagesBucketRegionalDomainName: !GetAtt StorageStack.Outputs.ImagesBucketRegionalDomainName
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/database.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        DatabaseSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.DatabaseSecurityGroupId
        DatabaseInstanceClass: !Ref DatabaseInstanceClass
        DatabaseName: !Ref DatabaseName
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  EcrStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/ecr.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  AlbStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/alb.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnet1Id: !GetAtt NetworkStack.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt NetworkStack.Outputs.PublicSubnet2Id
        AlbSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.AlbSecurityGroupId
        ContainerPort: !Ref ContainerPort
        HealthCheckPath: !Ref HealthCheckPath
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  EcsStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/ecs.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        EcsServiceSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.EcsServiceSecurityGroupId
        ContainerPort: !Ref ContainerPort
        HealthCheckPath: !Ref HealthCheckPath
        EcrRepositoryUri: !GetAtt EcrStack.Outputs.RepositoryUri
        ImageTag: !Ref ImageTag
        BlueTargetGroupArn: !GetAtt AlbStack.Outputs.BlueTargetGroupArn
        ImagesBucketArn: !GetAtt StorageStack.Outputs.ImagesBucketArn
        ImagesBucketName: !GetAtt StorageStack.Outputs.ImagesBucketName
        CloudFrontDomainName: !GetAtt CdnStack.Outputs.DistributionDomainName
        LoadBalancerDnsName: !GetAtt AlbStack.Outputs.LoadBalancerDnsName
        DatabaseSecretArn: !GetAtt DatabaseStack.Outputs.DatabaseSecretArn
        DatabaseEndpointAddress: !GetAtt DatabaseStack.Outputs.DatabaseEndpointAddress
        DatabaseEndpointPort: !GetAtt DatabaseStack.Outputs.DatabaseEndpointPort
        DatabaseName: !Ref DatabaseName
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        CpuScalingTargetValue: !Ref CpuScalingTargetValue
        ServiceDesiredCount: !Ref ServiceDesiredCount
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  CodeDeployStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/codedeploy.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        EcsClusterName: !GetAtt EcsStack.Outputs.ClusterName
        EcsServiceName: !GetAtt EcsStack.Outputs.ServiceName
        ListenerArn: !GetAtt AlbStack.Outputs.ListenerArn
        BlueTargetGroupName: !GetAtt AlbStack.Outputs.BlueTargetGroupName
        GreenTargetGroupName: !GetAtt AlbStack.Outputs.GreenTargetGroupName
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  PipelineStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/pipeline.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        EcrRepositoryName: !GetAtt EcrStack.Outputs.RepositoryName
        ImageTag: !Ref ImageTag
        PipelineArtifactsBucketName: !GetAtt StorageStack.Outputs.PipelineArtifactsBucketName
        CodeDeployApplicationName: !GetAtt CodeDeployStack.Outputs.ApplicationName
        CodeDeployDeploymentGroupName: !GetAtt CodeDeployStack.Outputs.DeploymentGroupName
        EcsClusterName: !GetAtt EcsStack.Outputs.ClusterName
        EcsServiceName: !GetAtt EcsStack.Outputs.ServiceName
        EcsTaskExecutionRoleArn: !GetAtt EcsStack.Outputs.TaskExecutionRoleArn
        EcsTaskRoleArn: !GetAtt EcsStack.Outputs.TaskRoleArn
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

  EventBridgeStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateVersion}/nested/eventbridge.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        EcrRepositoryName: !GetAtt EcrStack.Outputs.RepositoryName
        PipelineArn: !GetAtt PipelineStack.Outputs.PipelineArn
      Tags:
        - Key: EnvironmentName
          Value: !Ref EnvironmentName

Outputs:
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId

  PublicSubnet1Id:
    Value: !GetAtt NetworkStack.Outputs.PublicSubnet1Id

  PublicSubnet2Id:
    Value: !GetAtt NetworkStack.Outputs.PublicSubnet2Id

  PrivateSubnet1Id:
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id

  PrivateSubnet2Id:
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id

  VpcEndpointSecurityGroupId:
    Value: !GetAtt NetworkStack.Outputs.VpcEndpointSecurityGroupId

  AlbSecurityGroupId:
    Value: !GetAtt SecurityGroupsStack.Outputs.AlbSecurityGroupId

  EcsServiceSecurityGroupId:
    Value: !GetAtt SecurityGroupsStack.Outputs.EcsServiceSecurityGroupId

  DatabaseSecurityGroupId:
    Value: !GetAtt SecurityGroupsStack.Outputs.DatabaseSecurityGroupId

  ImagesBucketName:
    Value: !GetAtt StorageStack.Outputs.ImagesBucketName

  ImagesBucketArn:
    Value: !GetAtt StorageStack.Outputs.ImagesBucketArn

  ImagesBucketRegionalDomainName:
    Value: !GetAtt StorageStack.Outputs.ImagesBucketRegionalDomainName

  PipelineArtifactsBucketName:
    Value: !GetAtt StorageStack.Outputs.PipelineArtifactsBucketName

  CloudFrontDistributionId:
    Value: !GetAtt CdnStack.Outputs.DistributionId

  CloudFrontDomainName:
    Value: !GetAtt CdnStack.Outputs.DistributionDomainName

  DatabaseEndpointAddress:
    Value: !GetAtt DatabaseStack.Outputs.DatabaseEndpointAddress

  DatabaseEndpointPort:
    Value: !GetAtt DatabaseStack.Outputs.DatabaseEndpointPort

  DatabaseSecretArn:
    Value: !GetAtt DatabaseStack.Outputs.DatabaseSecretArn

  DatabaseName:
    Value: !GetAtt DatabaseStack.Outputs.DatabaseName

  EcrRepositoryName:
    Value: !GetAtt EcrStack.Outputs.RepositoryName

  EcrRepositoryUri:
    Value: !GetAtt EcrStack.Outputs.RepositoryUri

  LoadBalancerDnsName:
    Value: !GetAtt AlbStack.Outputs.LoadBalancerDnsName

  ListenerArn:
    Value: !GetAtt AlbStack.Outputs.ListenerArn

  BlueTargetGroupName:
    Value: !GetAtt AlbStack.Outputs.BlueTargetGroupName

  GreenTargetGroupName:
    Value: !GetAtt AlbStack.Outputs.GreenTargetGroupName

  EcsClusterName:
    Value: !GetAtt EcsStack.Outputs.ClusterName

  EcsServiceName:
    Value: !GetAtt EcsStack.Outputs.ServiceName

  EcsTaskDefinitionFamily:
    Value: !GetAtt EcsStack.Outputs.TaskDefinitionFamily

  EcsTaskExecutionRoleArn:
    Value: !GetAtt EcsStack.Outputs.TaskExecutionRoleArn

  EcsTaskRoleArn:
    Value: !GetAtt EcsStack.Outputs.TaskRoleArn

  EcsLogGroupName:
    Value: !GetAtt EcsStack.Outputs.LogGroupName

  EcsContainerPort:
    Value: !GetAtt EcsStack.Outputs.ContainerPort

  EcsHealthCheckPath:
    Value: !GetAtt EcsStack.Outputs.HealthCheckPath

  EcsTaskCpu:
    Value: !GetAtt EcsStack.Outputs.TaskCpu

  EcsTaskMemory:
    Value: !GetAtt EcsStack.Outputs.TaskMemory

  CodeDeployApplicationName:
    Value: !GetAtt CodeDeployStack.Outputs.ApplicationName

  CodeDeployDeploymentGroupName:
    Value: !GetAtt CodeDeployStack.Outputs.DeploymentGroupName

  PipelineName:
    Value: !GetAtt PipelineStack.Outputs.PipelineName

  PipelineArn:
    Value: !GetAtt PipelineStack.Outputs.PipelineArn

  EventBridgeRuleName:
    Value: !GetAtt EventBridgeStack.Outputs.RuleName
