AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate cluster, task definition, service, and Auto Scaling for the
  application.

Parameters:
  EnvironmentName:
    Type: String
    Default: photo-uploader

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  EcsServiceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  ContainerPort:
    Type: Number
    Default: 3000

  HealthCheckPath:
    Type: String
    Default: /health

  EcrRepositoryUri:
    Type: String

  ImageTag:
    Type: String
    Default: latest

  BlueTargetGroupArn:
    Type: String

  ImagesBucketArn:
    Type: String

  ImagesBucketName:
    Type: String

  CloudFrontDomainName:
    Type: String

  LoadBalancerDnsName:
    Type: String

  DatabaseSecretArn:
    Type: String

  DatabaseEndpointAddress:
    Type: String

  DatabaseEndpointPort:
    Type: String

  DatabaseName:
    Type: String

  TaskCpu:
    Type: String
    Default: '256'

  TaskMemory:
    Type: String
    Default: '512'

  CpuScalingTargetValue:
    Type: Number
    Default: 60

  ServiceDesiredCount:
    Type: Number
    Default: 1
    Description: >
      Set to 0 for the very first deploy, before any image exists in ECR
      (the service can't start tasks without one). Flip back to 1 once an
      image has been pushed.

Resources:
  ##############################################################
  # Fargate cluster that runs the application service.
  ##############################################################
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-cluster

  ##############################################################
  # CloudWatch Logs group the application container writes to.
  ##############################################################
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-app
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-app-logs

  ##############################################################
  # IAM role ECS uses to pull the image, write logs, and read
  # the database secret when starting a task.
  ##############################################################
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-task-execution-role

  ##############################################################
  # Permissions TaskExecutionRole needs to read the database
  # secret while starting a task.
  ##############################################################
  TaskExecutionRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-ecs-task-execution-policy
      Roles:
        - !Ref TaskExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'secretsmanager:GetSecretValue'
            Resource: !Ref DatabaseSecretArn

  ##############################################################
  # IAM role the running application container assumes to read
  # and write the images bucket and read the database secret.
  ##############################################################
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-task-role

  ##############################################################
  # Permissions the running container needs to read/write the
  # images bucket and read the database secret.
  ##############################################################
  TaskRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${EnvironmentName}-ecs-task-policy
      Roles:
        - !Ref TaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
            Resource: !Sub ${ImagesBucketArn}/*
          - Effect: Allow
            Action: 'secretsmanager:GetSecretValue'
            Resource: !Ref DatabaseSecretArn

  ##############################################################
  # Task definition for the application container, including
  # its health check, environment, secrets, and log
  # configuration.
  ##############################################################
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-app
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${EcrRepositoryUri}:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub curl -f http://localhost:${ContainerPort}${HealthCheckPath} || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          Environment:
            - Name: PORT
              Value: !Ref ContainerPort
            - Name: DB_HOST
              Value: !Ref DatabaseEndpointAddress
            - Name: DB_PORT
              Value: !Ref DatabaseEndpointPort
            - Name: DB_NAME
              Value: !Ref DatabaseName
            - Name: IMAGES_BUCKET_NAME
              Value: !Ref ImagesBucketName
            - Name: CLOUDFRONT_DOMAIN
              Value: !Ref CloudFrontDomainName
            - Name: CORS_ORIGINS
              Value: !Sub http://${LoadBalancerDnsName}
          Secrets:
            - Name: DB_CREDENTIALS
              ValueFrom: !Ref DatabaseSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-app-task-definition

  ##############################################################
  # ECS service running the application, deployed via
  # CodeDeploy blue/green.
  ##############################################################
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${EnvironmentName}-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref ServiceDesiredCount
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsServiceSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroupArn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-service

  ##############################################################
  # Registers the ECS service with Application Auto Scaling,
  # allowing 1 to 4 tasks.
  ##############################################################
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 4

  ##############################################################
  # Target-tracking policy that scales the service on average
  # CPU utilization.
  ##############################################################
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuScalingTargetValue
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref Cluster

  ClusterArn:
    Value: !GetAtt Cluster.Arn

  ServiceName:
    Value: !GetAtt Service.Name

  TaskDefinitionFamily:
    Value: !Sub ${EnvironmentName}-app

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

  LogGroupName:
    Value: !Ref LogGroup

  ContainerPort:
    Value: !Ref ContainerPort

  HealthCheckPath:
    Value: !Ref HealthCheckPath

  TaskCpu:
    Value: !Ref TaskCpu

  TaskMemory:
    Value: !Ref TaskMemory
